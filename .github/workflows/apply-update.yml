name: Apply update
on:
  push:
    paths: ['update.zip']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f update.zip ]; then
            unzip -oq update.zip
            rm update.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Apply update"
            git push
          fi
